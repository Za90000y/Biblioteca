<section class="login-section">
    <div class="login-card">
      <span class="admin-kicker">Biblioteca Digital</span>
      <h2 class="admin-title mb-1">Iniciar sesión</h2>
      <p class="text-secondary small mb-4">Ingresa tus datos para continuar.</p>
      <form>
        <div class="mb-3">
          <label class="form-label" for="login-usuario">Usuario</label>
          <input id="login-usuario" class="form-control" type="text" placeholder="Tu nombre de usuario">
        </div>
        <div class="mb-4">
          <label class="form-label" for="login-password">Contraseña</label>
          <input id="login-password" class="form-control" type="password" placeholder="Ingresa tu contraseña">
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-library" type="button">Ingresar</button>
          <button class="btn btn-outline-library" type="reset">Limpiar</button>
        </div>
      </form>
    </div>
</section>
