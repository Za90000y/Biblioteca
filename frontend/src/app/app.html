@if (comprobando) {
  <main class="container py-5 text-center" role="status">
    <div class="spinner-border text-success" aria-hidden="true"></div>
    <p class="mt-3 mb-0">Conectando con el backend de la biblioteca...</p>
  </main>
} @else if (!conectado) {
  <main class="container py-5" role="alert">
    <section class="admin-form mx-auto" style="max-width: 38rem">
      <span class="admin-kicker">Conexión requerida</span>
      <h1 class="admin-title">Backend no disponible</h1>
      <p class="text-secondary">La biblioteca necesita el backend y la base de datos para funcionar.</p>
      <p>{{ error }}</p>
      <button class="btn btn-library" type="button" (click)="comprobarBackend()">
        <i class="bi bi-arrow-clockwise me-2"></i>Reintentar conexión
      </button>
    </section>
  </main>
} @else {
  <app-header />
  <app-nav />
  <main class="page-shell">
    <section class="page-view" id="inicio"><app-principal /></section>
    <section class="page-view" id="autores"><div class="container py-5"><app-autores /></div></section>
    <section class="page-view" id="libros"><div class="container py-5"><app-libros /></div></section>
    <section class="page-view" id="usuarios"><div class="container py-5"><app-usuarios /></div></section>
    <section class="page-view" id="prestamos"><div class="container py-5"><app-prestamos /></div></section>
  </main>
  <app-footer />
}
