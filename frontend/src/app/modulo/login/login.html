<section class="login-section">
    <div class="login-card">
      <span class="admin-kicker">Biblioteca Digital</span>
      <h2 class="admin-title mb-1">{{ modoRegistro ? 'Crear cuenta' : 'Iniciar sesión' }}</h2>
      <p class="text-secondary small mb-4">{{ modoRegistro ? 'Regístrate como lector para solicitar préstamos.' : 'Ingresa tus datos para continuar.' }}</p>
      @if (error) { <div class="alert alert-danger" role="alert">{{ error }}</div> }
      @if (modoRegistro) {
      <form (ngSubmit)="registrar()" #registroForm="ngForm">
        <div class="mb-3">
          <label class="form-label" for="registro-nombre">Nombre</label>
          <input id="registro-nombre" name="nombre" class="form-control" type="text" maxlength="120" autocomplete="name" required [(ngModel)]="nombre">
        </div>
        <div class="mb-3">
          <label class="form-label" for="registro-email">Correo</label>
          <input id="registro-email" name="email" class="form-control" type="email" maxlength="150" autocomplete="email" required [(ngModel)]="email">
        </div>
        <div class="mb-3">
          <label class="form-label" for="registro-usuario">Usuario</label>
          <input id="registro-usuario" name="username" class="form-control" type="text" maxlength="50" autocomplete="username" required [(ngModel)]="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="registro-password">Contraseña (mínimo 8 caracteres)</label>
          <input id="registro-password" name="password" class="form-control" type="password" minlength="8" maxlength="72" autocomplete="new-password" required [(ngModel)]="password">
        </div>
        <div class="mb-4">
          <label class="form-label" for="registro-confirmar-password">Confirmar contraseña</label>
          <input id="registro-confirmar-password" name="confirmarPassword" class="form-control" type="password" minlength="8" maxlength="72" autocomplete="new-password" required [(ngModel)]="confirmarPassword">
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-library" type="submit" [disabled]="registroForm.invalid || ingresando || password !== confirmarPassword">
            {{ ingresando ? 'Creando cuenta...' : 'Crear cuenta' }}
          </button>
          <button class="btn btn-outline-library" type="button" (click)="mostrarLogin()">Volver</button>
        </div>
      </form>
      } @else {
      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
        <div class="mb-3">
          <label class="form-label" for="login-email">Correo electrónico</label>
          <input id="login-email" name="email" class="form-control" type="email" maxlength="150" autocomplete="email" placeholder="tu@correo.com" required [(ngModel)]="email">
        </div>
        <div class="mb-4">
          <label class="form-label" for="login-password">Contraseña</label>
          <input id="login-password" name="password" class="form-control" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required [(ngModel)]="password">
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-library" type="submit" [disabled]="loginForm.invalid || ingresando">
            {{ ingresando ? 'Ingresando...' : 'Ingresar' }}
          </button>
          <button class="btn btn-outline-library" type="reset" (click)="limpiar()">Limpiar</button>
        </div>
      </form>
      <div class="mt-3 text-center">
        <span class="text-secondary small">¿No tienes cuenta?</span>
        <button class="btn btn-link btn-sm" type="button" (click)="mostrarRegistro()">Regístrate como lector</button>
      </div>
      }
    </div>
</section>
